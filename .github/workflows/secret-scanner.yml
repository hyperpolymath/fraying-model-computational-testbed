# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
# Calls the estate's shared secret scanner (gitleaks + rust-secrets +
# shell-secrets). Replaces an inline trufflehog job: trufflehog was retired
# estate-wide as redundant, and this repo had no other leak scanning, so the
# scanner is UPGRADED here rather than removed.
#
# The reusable runs the pinned scanners directly and needs no caller secrets.
name: 'Secret Scanner'
on:
  pull_request:
  push:
    branches: [main, master]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  actions: read
  contents: read
jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/secret-scanner-reusable.yml@da2c748aad55c1a1dcba00b60fe4a35017bc6540
